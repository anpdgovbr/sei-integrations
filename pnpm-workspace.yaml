packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  sonar-scanner: true

catalog:
  "@types/node": ^26.6.1
  "@vitest/coverage-v8": ^4.1.11
  fast-xml-parser: ^5.11.1
  rimraf: "^6.1.3"
  sonar-scanner: "^3.1.0"
  tsup: "^8.5.1"
  tsx: ^4.23.13
  typedoc: ^0.28.20
  typedoc-plugin-mdn-links: "^5.1.1"
  typescript: "^6.0.3"
  vitest: ^4.1.11

# Força versões com correções de segurança em dependências transitivas de
# ferramentas de desenvolvimento.
overrides:
  # A versão 1.0.1 não exporta filter.id na entrada usada pelo Rolldown 1.2.9.
  "rolldown@1.2.9>@rolldown/pluginutils": "1.0.0"
  brace-expansion@1: "^1.1.16"
  brace-expansion@5: "^5.0.9"
  esbuild@<0.28.1: ">=0.28.1"
  js-yaml@3: "^3.15.1"
  js-yaml@4: "^4.3.1"
  nanoid@3: "^3.3.17"
  postcss@8: "^8.5.23"

minimumReleaseAge: 0

onlyBuiltDependencies:
  - esbuild
  - sonar-scanner
