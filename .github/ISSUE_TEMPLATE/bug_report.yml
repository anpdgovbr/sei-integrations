name: Reportar um bug
description: Algo não está funcionando como esperado em um dos pacotes do monorepo.
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Pacote afetado
      options:
        - "@anpdgovbr/sip-client"
        - "@anpdgovbr/sei-client"
        - "@anpdgovbr/sei-sip-soap"
        - Outro / não sei
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versão do pacote
      placeholder: "Versão instalada (consulte package.json/lockfile)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição do problema
      description: O que aconteceu? O que você esperava que acontecesse?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      description: |
        Inclua um trecho de código mínimo, se possível. Não inclua chaves de
        acesso, tokens ou dados reais de processos/documentos — use valores
        fictícios ou anonimizados.
      render: ts
    validations:
      required: false

  - type: input
    id: operation
    attributes:
      label: Método da lib e operação SOAP
      placeholder: "sei.consultas.consultarProcedimento / consultarProcedimento"
    validations:
      required: false

  - type: textarea
    id: failure
    attributes:
      label: Retorno ou erro anonimizado
      description: Informe status HTTP, operation, fault e mensagem quando disponíveis. Distinga lista vazia, null e exceção; não cole envelopes com credenciais ou dados reais.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      placeholder: |
        Node.js:
        Gerenciador de pacotes e versão:
        Sistema operacional:
        Versão do SEI/SIP e ambiente (produção/homologação):
        Operação habilitada no serviço e unidade autorizada (se souber):
    validations:
      required: false
