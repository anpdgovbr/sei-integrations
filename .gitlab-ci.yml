# =====================================================================
# GitLab CI/CD Pipeline - @anpdgovbr/sei-integrations (Monorepo)
# =====================================================================

# ==========================================
# COMPONENTES DO CATÁLOGO
# ==========================================
include:
  - component: gitlab.anpd.gov.br/publico/ci-templates/ci-gitleaks@v8.1.0

  - component: gitlab.anpd.gov.br/publico/ci-templates/ci-node@v8.1.0
    inputs:
      pnpm_version: "12.3.4"
      dependency_mode: "isolated"
      execution_profile: "cost_optimized"
      # test:coverage compila os pacotes e gera os relatórios agregados na raiz.
      test_command: "pnpm run test:coverage && test -f coverage/cobertura-coverage.xml"
      build_validation_command: &build_validation |
        FAILED=""
        for pkg in packages/*/; do
          if [ -f "$pkg/package.json" ]; then
            PKG=$(node -p "require('./$pkg/package.json').name")
            if [ ! -d "$pkg/dist" ]; then
              echo "dist ausente: $PKG"
              FAILED="$FAILED $PKG"
            else
              echo "OK: $PKG"
            fi
          fi
        done
        [ -z "$FAILED" ] || { echo "Falha:$FAILED"; exit 1; }

  - component: gitlab.anpd.gov.br/publico/ci-templates/sonarqube@v8.1.0
    inputs:
      sonar_project_key: "anpd-sei-integrations"
      integration_branch: "dev"
      needs_job: "Node | Executar testes"

  - component: gitlab.anpd.gov.br/publico/ci-templates/ci-changeset-monorepo@v8.1.0
    inputs:
      project_type: "lib"
      pnpm_version: "12.3.4"
      build_validation_script: *build_validation
      npm_scope: "@anpdgovbr"
      release_mode: "global"
      global_tag_prefix: "v"
      require_protected_tag: "true"

  - component: gitlab.anpd.gov.br/publico/ci-templates/pages-typedoc@v8.1.0
    inputs:
      project_type: "lib"

  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ==========================================
# VARIÁVEIS DO PROJETO
# ==========================================
variables:
  INTEGRATION_BRANCH: "dev"
  HOMOLOG_BRANCH: "main"
  NPM_CONFIG_OPTIONAL: "true"
  SECRET_DETECTION_ENABLED: "true"

# ==========================================
# WORKFLOW RULES
# ==========================================
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $INTEGRATION_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $HOMOLOG_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - when: never

# ==========================================
# STAGES
# ==========================================
stages:
  - security
  - install
  - lint
  - test
  - build
  - sonar
  - deploy

"TypeDoc | Publicar no Pages":
  rules:
    # Não publica se há changesets pendentes (aguarda bump)
    - if: '$PROJECT_TYPE == "lib" && $CI_COMMIT_BRANCH == $HOMOLOG_BRANCH'
      exists:
        - .changeset/*.md
      when: never
    - if: '$PROJECT_TYPE != "lib" && $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH'
      exists:
        - .changeset/*.md
      when: never
    # Libs publicam na homologacao (main)
    - if: '$PROJECT_TYPE == "lib" && $CI_COMMIT_BRANCH == $HOMOLOG_BRANCH'
      when: on_success
    # Apps/APIs publicam na producao (stable)
    - if: '$PROJECT_TYPE != "lib" && $CI_COMMIT_BRANCH == $PRODUCTION_BRANCH'
      when: on_success
    # Permite override manual
    - if: '$PAGES_FORCE_DEPLOY == "true"'
      when: on_success
    - if: "$CI_COMMIT_BRANCH"
      when: manual
      allow_failure: true

secret_detection:
  stage: security
